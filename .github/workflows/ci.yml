# Testes em todo pull request; deploy de produção só depois deles.
#
# Fluxo (regra: "sempre fazer testes antes de subir em produção"):
#   PR  -> testes + md-guard -> migrações no banco de preview (a Vercel cria o deploy de preview do PR)
#   merge na main -> testes -> migrações no banco de produção -> deploy de produção -> /api/health
#
# A main é protegida: só recebe merge de PR com os checks verdes. O deploy automático da Vercel
# na main está desligado (vercel.json), então nada chega à produção sem passar por aqui.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: bot_teste
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:teste@localhost:5432/bot_teste
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        run: pytest -q

      # O front do admin usa um cliente gerado deste esquema: mudou a API, tem que regenerar (npm run gerar-api).
      - name: openapi.json do admin em dia com a API
        run: python scripts/ci/exportar_openapi.py && git diff --exit-code admin/openapi.json

      # Sobe o app do mesmo jeito que a Vercel importa (main.py) e chama /api/health.
      # Pega erros de importação/dependência antes de chegarem em produção.
      - name: Teste de fumaça (app sobe e responde)
        run: |
          uvicorn main:app --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then echo; exit 0; fi
            sleep 1
          done
          echo "O app não respondeu. Log do servidor:"
          cat uvicorn.log
          exit 1

  # Regra 1: nenhum arquivo .md novo entra sem pedido (o README.md já existe e pode mudar).
  md-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Recusar .md novo
        run: |
          novos=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD" | grep -Ei '\.md$' | grep -v '^README\.md$' || true)
          if [ -n "$novos" ]; then
            echo "Arquivos .md novos não entram sem pedido (regra 1):"
            echo "$novos"
            exit 1
          fi

  # As migrações rodam aqui, fora do runtime serverless. Elas só acrescentam (expand): o código
  # que está no ar continua funcionando com o schema novo até o deploy terminar.
  migrar-preview:
    if: github.event_name == 'pull_request'
    needs: testes
    runs-on: ubuntu-latest
    env:
      BOT_DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: alembic upgrade head (banco de preview)
        run: |
          if [ -z "$BOT_DATABASE_URL" ]; then echo "::warning::segredo DATABASE_URL_PREVIEW ausente; migrações do preview não rodaram"; exit 0; fi
          alembic upgrade head

  deploy-producao:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: testes
    runs-on: ubuntu-latest
    environment: producao
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      BOT_DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCAO }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt

      - name: alembic upgrade head (banco de produção)
        run: |
          if [ -z "$BOT_DATABASE_URL" ]; then echo "segredo DATABASE_URL_PRODUCAO ausente"; exit 1; fi
          alembic upgrade head

      - name: Deploy de produção (Vercel, a partir deste commit)
        run: python3 scripts/ci/deploy_vercel.py --repo-id 1384419787 --ref main --sha "$GITHUB_SHA"
